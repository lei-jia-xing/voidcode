repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # Tokenizer vocabularies are binary assets that legitimately exceed the
        # 500 KB guard; they are bz2-compressed as tightly as a stdlib codec can
        # and regenerated by `scripts/extract_tokenizer_data.py`.
        exclude: ^src/voidcode/provider/tokenizer_data/

  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix .
        language: system
        pass_filenames: false
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format .
        language: system
        pass_filenames: false
        types_or: [python, pyi]

      - id: ty
        name: ty check
        entry: uv run ty check src
        language: system
        pass_filenames: false
        types_or: [python, pyi]

      - id: config-schema
        name: config schema check
        entry: uv run python scripts/generate_config_schema.py --check
        language: system
        pass_filenames: false
        files: ^(schema/voidcode\.config\.schema\.json|scripts/generate_config_schema\.py|src/voidcode/(runtime/config(_models|_schema)?\.py|runtime/policy\.py|provider/config\.py))$

      - id: frontend-lint
        name: frontend lint
        entry: bash -lc 'cd frontend && bun run lint'
        language: system
        pass_filenames: false
        files: ^frontend/src/.*\.(ts|tsx)$

      - id: frontend-format
        name: frontend format
        entry: bash -lc 'cd frontend && bun run format'
        language: system
        pass_filenames: false
        files: ^frontend/src/.*\.(ts|tsx|css)$

      # Scoped to the paths that can move the document or the artifact it
      # generates from: a backend change can rename a field, and an artifact or
      # generator change can desynchronise them. Measured at ~5.5s when it runs
      # (the checker imports the transport and runs openapi-typescript), and it
      # does not run for commits that touch neither side.
      - id: frontend-api-types
        name: frontend API types are current
        entry: bash -lc 'uv run python -X utf8 scripts/generate_frontend_api_types.py --check'
        language: system
        pass_filenames: false
        files: ^(src/voidcode/|frontend/src/lib/runtime/|scripts/generate_frontend_api_types\.py|frontend/package\.json|frontend/bun\.lock)
