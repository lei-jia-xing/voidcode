[tools]
uv = "0.12.15"
bun = "1.4.2"

[env]
_.python.venv = { path = ".venv" }
_.file = ".env"
PYTHONPATH = "src"
PYTHONUTF8 = "1"
PYTHONIOENCODING = "utf-8"

[tasks."frontend:install"]
run = "bun install"
dir = "frontend"

[tasks."frontend:dev"]
run = "bun run dev"
dir = "frontend"

[tasks."frontend:build"]
run = "bun run build"
dir = "frontend"

[tasks."frontend:lint"]
run = "bun run lint"
dir = "frontend"

[tasks."frontend:typecheck"]
run = "bun run typecheck"
dir = "frontend"

[tasks."frontend:test"]
run = "bun run test"
dir = "frontend"

[tasks."frontend:e2e"]
depends = ["frontend:build", "frontend:test:e2e:run"]

[tasks."frontend:test:e2e:run"]
run = "bun run test:e2e"
dir = "frontend"

[tasks."frontend:coverage"]
run = "bun run test:coverage"
dir = "frontend"

[tasks."frontend:check"]
depends = ["frontend:lint", "frontend:typecheck", "frontend:test"]

[tasks."frontend:api:generate"]
description = "Generate frontend/src/lib/runtime/generated/api.d.ts from the transport's OpenAPI document"
run = "uv run python -X utf8 scripts/generate_frontend_api_types.py"

[tasks."frontend:api:check"]
description = "Fail when the committed generated API types no longer match the backend schema"
run = "uv run python -X utf8 scripts/generate_frontend_api_types.py --check"

[tasks."frontend:check:e2e"]
depends = ["frontend:check", "frontend:e2e"]

[tasks.lint]
run = "uv run ruff check ."

[tasks.format]
run = "uv run ruff format ."

[tasks.typecheck]
run = "uv run ty check src"

[tasks.test]
description = "Run the Python test suite"
run = "uv run python -X utf8 -m pytest -n auto --dist worksteal"

[tasks."test:coverage"]
description = "Run the Python test suite with coverage"
run = "uv run python -X utf8 -m pytest -n auto --dist worksteal --cov=voidcode --cov-report=term-missing"

[tasks.build]
run = "uv build"

[tasks."release:notes"]
run = "git-cliff --config cliff.toml --output CHANGELOG.md"

[tasks."release:preview"]
run = "git-cliff --config cliff.toml"

[tasks."catalog:generate"]
description = "Regenerate src/voidcode/provider/model_catalog_data.json from the upstream catalog mirror"
run = "uv run python -X utf8 scripts/generate_model_catalog.py"

[tasks."schema:check"]
description = "Fail when schema/voidcode.config.schema.json is not the schema generated from the config payload models"
run = "uv run python scripts/generate_config_schema.py --check"

[tasks.check]
depends = ["lint", "typecheck", "schema:check", "test", "frontend:api:check", "frontend:check"]

[tasks.ci]
depends = ["lint", "typecheck", "test:coverage", "build", "frontend:api:check", "frontend:check", "frontend:build"]

[tasks.pre-commit]
run = "uv run pre-commit run --all-files"
